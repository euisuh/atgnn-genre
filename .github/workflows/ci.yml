name: checks

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax
        run: python -m compileall -q configs models scripts utils train.py
      - name: Shell syntax
        run: for f in cloud/*.sh; do bash -n "$f"; done
      # CPU torch only (no PyG): tests cover utils/hierarchy.py and utils/metrics.py.
      - name: Unit tests
        run: |
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scikit-learn pytest
          python -m pytest -q tests
